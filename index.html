<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QCM Électrostatique</title>

<style>
/* Layout: une colonne étroite, carte-question centrée, réponses en pile tappable */
:root{
  --bg:#eef1f7; --surface:#ffffff; --surface-2:#f6f8fc;
  --fg:#101320; --muted:#5b647a; --line:#d8dfec;
  --accent:#3243d4; --accent-soft:#e6e9fb;
  --ok:#0b6b45; --ok-bg:#e2f4ec; --ok-line:#9bd6bb;
  --bad:#a81f16; --bad-bg:#fbe9e7; --bad-line:#eeb0aa;
  --display:"Space Grotesk",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c0e14; --surface:#161922; --surface-2:#1d212c;
  --fg:#eef1f8; --muted:#98a1b6; --line:#282e3c;
  --accent:#8e9bff; --accent-soft:#1d2236;
  --ok:#5fd39c; --ok-bg:#122a20; --ok-line:#275c44;
  --bad:#ff9288; --bad-bg:#2b1412; --bad-line:#5e2a25;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0c0e14; --surface:#161922; --surface-2:#1d212c;
  --fg:#eef1f8; --muted:#98a1b6; --line:#282e3c;
  --accent:#8e9bff; --accent-soft:#1d2236;
  --ok:#5fd39c; --ok-bg:#122a20; --ok-line:#275c44;
  --bad:#ff9288; --bad-bg:#2b1412; --bad-line:#5e2a25;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);line-height:1.5;margin:0}
.wrap{max-width:660px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:16px}

header{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px}
h1{font-family:var(--display);font-weight:700;font-size:1.5rem;margin:0;letter-spacing:-.02em;text-wrap:balance}
.sub{color:var(--muted);font-size:.85rem}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:.78rem;padding:5px 11px;border-radius:999px;cursor:pointer;
  background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#0c0e14}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#0c0e14}}
.chip:disabled{opacity:.45;cursor:default}
.chip.err:not(:disabled)[aria-pressed="false"]{border-color:var(--bad-line);color:var(--bad)}
.chip:focus-visible,.opt:focus-visible,.next:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.prog{display:flex;flex-direction:column;gap:5px}
.bar{height:7px;border-radius:999px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);border-radius:999px;transition:width .25s}
.prog .lbl{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums;
  display:flex;justify-content:space-between;gap:10px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 16px;
  display:flex;flex-direction:column;gap:14px;min-width:0}
.tag{font-family:var(--display);font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;
  color:var(--accent);font-weight:700}
.q{font-size:1.1rem;font-weight:500;margin:0;text-wrap:balance}
mjx-container{color:inherit}
mjx-container[display="true"]{margin:.4em 0!important}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{font:inherit;text-align:left;width:100%;min-width:0;cursor:pointer;
  background:var(--surface-2);color:var(--fg);border:1px solid var(--line);
  border-radius:10px;padding:11px 12px;display:flex;gap:10px;align-items:flex-start;
  transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.key{font-family:var(--display);font-weight:700;font-size:.75rem;color:var(--muted);
  border:1px solid var(--line);border-radius:5px;min-width:20px;height:20px;
  display:grid;place-items:center;flex:none;margin-top:2px}
.opt .txt{min-width:0}
.opt.good{background:var(--ok-bg);border-color:var(--ok-line)}
.opt.good .key{color:var(--ok);border-color:var(--ok-line)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad-line)}
.opt.bad .key{color:var(--bad);border-color:var(--bad-line)}

.exp{border-left:3px solid var(--accent);background:var(--accent-soft);
  padding:10px 12px;border-radius:0 8px 8px 0;font-size:.9rem}
.verdict.ok{color:var(--ok);font-weight:600}
.verdict.no{color:var(--bad);font-weight:600}

.foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.score{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.score b{color:var(--fg)}
.next{font:inherit;font-weight:600;cursor:pointer;background:var(--accent);color:#fff;
  border:none;border-radius:9px;padding:10px 18px}
:root[data-theme="dark"] .next{color:#0c0e14}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .next{color:#0c0e14}}
.note{color:var(--muted);font-size:.8rem;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head><body>
<div class="wrap">
  <header>
    <h1>QCM Électrostatique</h1>
    <span class="sub">Chapitres 1 à 6 &middot; <span id="count"></span> questions &middot; boucle infinie</span>
  </header>

  <div class="chips" id="chips"></div>

  <div class="prog">
    <div class="bar"><i id="barfill"></i></div>
    <div class="lbl"><span id="mastered"></span><span id="errcount"></span></div>
  </div>

  <div class="card">
    <div class="tag" id="tag">Chapitre</div>
    <p class="q" id="question">Chargement…</p>
    <div class="opts" id="opts"></div>
    <div class="exp" id="exp" hidden></div>
    <div class="foot">
      <div class="score" id="score"></div>
      <button class="next" id="next" hidden>Question suivante</button>
    </div>
  </div>

  <p class="note">Touches 1 à 4 pour répondre, Entrée pour la suivante. Les questions ratées reviennent.</p>
</div>

<script>
const BANK = [
 // ---------- Chapitres 1-2 ----------
 {c:"1-2",q:"Champ créé par une charge ponctuelle $q$ à la distance $r$ :",o:["$E = K\\dfrac{q}{r^2}$","$E = K\\dfrac{q}{r}$","$E = K\\dfrac{q}{r^3}$","$E = K\\dfrac{q^2}{r^2}$"],a:0,e:"Loi de Coulomb. Le champ décroît en $1/r^2$, comme la force."},
 {c:"1-2",q:"L'unité du champ électrique :",o:["le V/m, ou N/C","le volt","le newton","le C/m"],a:0,e:"$\\vec F=q\\vec E$ donne des N/C, $\\vec E=-\\overrightarrow{\\mathrm{grad}}\\,V$ donne des V/m. Même unité."},
 {c:"1-2",q:"Champ créé par une distribution <b>continue</b> de charges :",o:["$\\vec E=K\\displaystyle\\int\\frac{dq}{PM^2}\\,\\vec u_{PM}$","$\\vec E=K\\dfrac{Q}{PM^2}\\vec u$","$\\vec E=K\\displaystyle\\int\\frac{dq}{PM}$","$\\vec E=K\\dfrac{Q}{PM}\\vec u$"],a:0,e:"« Continue » impose l'intégrale : chaque $dq$ est à une distance $PM$ différente, donc rien ne sort. C'est la question ratée le 3 novembre."},
 {c:"1-2",q:"Potentiel créé par une distribution continue :",o:["$V=K\\displaystyle\\int\\frac{dq}{PM}$","$V=K\\displaystyle\\int\\frac{dq}{PM^2}$","$V=K\\dfrac{Q}{PM^2}$","$V=K\\displaystyle\\int\\frac{dq}{PM^2}\\vec u$"],a:0,e:"En $1/PM$, et c'est un scalaire : pas de vecteur unitaire, pas de projection."},
 {c:"1-2",q:"Une densité <b>surfacique</b> $\\sigma$ donne :",o:["$dq=\\sigma\\,dS$","$dq=\\sigma\\,dV$","$dq=\\sigma\\,dl$","$dq=\\sigma\\,dS^2$"],a:0,e:"$\\sigma=dq/dS$. Linéique $\\to\\lambda\\,dl$, surfacique $\\to\\sigma\\,dS$, volumique $\\to\\rho\\,dV$."},
 {c:"1-2",q:"L'élément de volume en sphérique :",o:["$dV=r^2\\sin\\theta\\,dr\\,d\\theta\\,d\\varphi$","$dV=r\\,dr\\,d\\theta\\,dz$","$dV=r\\sin\\theta\\,dr\\,d\\theta\\,d\\varphi$","$dV=r^2\\,dr\\,d\\theta\\,d\\varphi$"],a:0,e:"Il se retrouve depuis $d\\vec{OM}=dr\\,\\vec u_r+r\\,d\\theta\\,\\vec u_\\theta+r\\sin\\theta\\,d\\varphi\\,\\vec u_\\varphi$ : on multiplie les trois composantes."},
 {c:"1-2",q:"Le déplacement élémentaire en cylindrique :",o:["$d\\vec{OM}=dr\\,\\vec u_r+r\\,d\\theta\\,\\vec u_\\theta+dz\\,\\vec u_z$","$d\\vec{OM}=dr\\,\\vec u_r+d\\theta\\,\\vec u_\\theta+dz\\,\\vec u_z$","$d\\vec{OM}=dr\\,\\vec u_r+r\\,d\\theta\\,\\vec u_\\theta+r\\,dz\\,\\vec u_z$","$d\\vec{OM}=dr\\,\\vec u_r+r\\sin\\theta\\,d\\theta\\,\\vec u_\\theta+dz\\,\\vec u_z$"],a:0,e:"Seule la composante orthoradiale porte un $r$. Le $\\sin\\theta$ n'apparaît qu'en sphérique."},
 {c:"1-2",q:"Élément de surface sur une sphère de rayon $R$ :",o:["$dS=R^2\\sin\\theta\\,d\\theta\\,d\\varphi$","$dS=R\\sin\\theta\\,d\\theta\\,d\\varphi$","$dS=R\\,d\\theta\\,d\\varphi$","$dS=R^2\\,d\\theta\\,d\\varphi$"],a:0,e:"Sur la sphère $r$ est figé donc $dr=0$ : il reste $(R\\,d\\theta)(R\\sin\\theta\\,d\\varphi)$."},
 {c:"1-2",q:"Élément de longueur sur un cercle de rayon $R$ :",o:["$dl=R\\,d\\theta$","$dl=dr$","$dl=dz$","$dl=R\\,dr$"],a:0,e:"Sur le cercle, $R$ est constant et seul $\\theta$ varie."},
 {c:"1-2",q:"Un plan de <b>symétrie</b> de la distribution passant par M impose que $\\vec E(M)$ :",o:["est contenu dans ce plan","est perpendiculaire à ce plan","est nul","est tangent aux lignes de champ"],a:0,e:"La composante perpendiculaire s'inverse par réflexion alors que la source ne change pas : elle est nulle. Deux plans de symétrie $\\Rightarrow$ $\\vec E$ porté par leur intersection."},
 {c:"1-2",q:"Un plan d'<b>antisymétrie</b> passant par M impose que $\\vec E(M)$ :",o:["est perpendiculaire à ce plan","est contenu dans ce plan","est nul partout","ne dépend pas de $\\theta$"],a:0,e:"Situation inverse de la symétrie : seule la composante normale survit."},
 {c:"1-2",q:"Un plan qui ne contient pas toute la distribution est :",o:["quelconque : il n'apprend rien","un plan de symétrie","un plan d'antisymétrie","toujours perpendiculaire à $\\vec E$"],a:0,e:"Un plan n'est de symétrie que s'il laisse la source entière invariante."},
 {c:"1-2",q:"Une invariance par translation selon $z$ signifie que :",o:["$\\vec E$ ne dépend pas de $z$","$\\vec E$ n'a pas de composante selon $z$","$\\vec E$ est nul selon $z$","$\\vec E$ est constant partout"],a:0,e:"Une invariance supprime une dépendance, jamais une composante. Ce sont les symétries qui suppriment les composantes."},
 {c:"1-2",q:"Les lignes de champ sont resserrées :",o:["là où le champ est fort","là où le champ est faible","là où $V$ est nul","sur les équipotentielles"],a:0,e:"La densité de lignes traduit l'intensité du champ. Elles ne se croisent jamais."},
 {c:"1-2",q:"Les lignes de champ partent :",o:["des charges $+$ vers les charges $-$","des charges $-$ vers les charges $+$","des potentiels faibles vers les forts","de l'infini vers les charges"],a:0,e:"Elles sortent du positif, entrent dans le négatif, et vont vers les potentiels décroissants."},
 {c:"1-2",q:"Sur un schéma, deux vecteurs champ en A et B doivent :",o:["avoir des longueurs différentes si les normes diffèrent","avoir toujours la même longueur","être perpendiculaires aux lignes de champ","partir de la charge"],a:0,e:"La longueur du vecteur traduit la norme. C'est le point enlevé au contrôle du 3 novembre."},

 // ---------- Gauss ----------
 {c:"Gauss",q:"Le théorème de Gauss s'écrit :",o:["$\\displaystyle\\oint \\vec E\\cdot d\\vec S=\\frac{Q_{int}}{\\varepsilon_0}$","$\\displaystyle\\oint \\vec E\\cdot d\\vec S=Q_{int}\\,\\varepsilon_0$","$\\displaystyle\\oint \\vec E\\cdot d\\vec S=\\frac{Q_{tot}}{\\varepsilon_0}$","$\\displaystyle\\oint \\vec E\\cdot d\\vec l=\\frac{Q_{int}}{\\varepsilon_0}$"],a:0,e:"Le flux de $\\vec E$ à travers une surface fermée vaut la charge enfermée divisée par $\\varepsilon_0$."},
 {c:"Gauss",q:"Dans $\\oint\\vec E\\cdot d\\vec S$, le vecteur $d\\vec S=dS\\,\\vec n$ est :",o:["normal à la surface, orienté vers l'extérieur","tangent à la surface","orienté vers l'intérieur","toujours selon $\\vec u_z$"],a:0,e:"« Normal » veut dire perpendiculaire, et sur une surface fermée il sort toujours. C'est le « $\\vec n$ ? » rouge de ta copie."},
 {c:"Gauss",q:"Le $Q_{int}$ du théorème est :",o:["la charge enfermée par la surface de Gauss","la charge totale de la distribution","la charge portée par la surface de Gauss","la charge du conducteur intérieur seulement"],a:0,e:"À gauche on intègre sur la surface de Gauss ; à droite on compte seulement ce qu'elle enferme."},
 {c:"Gauss",q:"On peut appliquer Gauss seulement si :",o:["les symétries rendent $\\|\\vec E\\|$ constant sur la surface et $\\vec E\\parallel d\\vec S$","la distribution est volumique","la charge est positive","le point M est à l'extérieur"],a:0,e:"Sans cela l'intégrale ne se simplifie pas. Pour une spire, un disque ou une tige finie : méthode intégrale."},
 {c:"Gauss",q:"Fil infini, surface de Gauss cylindrique. Quelle partie donne un flux nul ?",o:["les deux disques","la surface latérale","aucune","les trois"],a:0,e:"$\\vec E$ est radial, les disques ont $d\\vec S$ selon $\\pm\\vec u_z$ : $\\vec u_r\\cdot\\vec u_z=0$. Seul le latéral compte."},
 {c:"Gauss",q:"Plan infini, surface de Gauss cylindrique. Quelle partie donne un flux nul ?",o:["la surface latérale","les deux disques","aucune","les trois"],a:0,e:"Exactement l'inverse du fil : $\\vec E$ est selon $\\vec u_z$, le latéral a $d\\vec S$ selon $\\vec u_r$. Les deux disques, eux, s'ajoutent."},
 {c:"Gauss",q:"Pour le plan infini, les flux des deux disques :",o:["s'ajoutent","s'annulent","sont nuls","dépendent de la hauteur du cylindre"],a:0,e:"Au-dessus $\\vec E=+E\\vec u_z$ avec $d\\vec S=+\\vec u_z$ ; en dessous $\\vec E=-E\\vec u_z$ avec $d\\vec S=-\\vec u_z$. Moins par moins donne plus."},
 {c:"Gauss",q:"Une charge <b>surfacique</b> provoque, à la traversée :",o:["un saut du champ de $\\sigma/\\varepsilon_0$","un champ continu","un saut du potentiel","un champ nul"],a:0,e:"Une charge volumique, elle, donne un champ continu. Bon test pour vérifier un résultat."},
 {c:"Gauss",q:"Quand M est à l'intérieur de la matière chargée, par rapport au cas extérieur :",o:["le membre de gauche est identique, seul $Q_{int}$ change","le membre de gauche change","tout change","le théorème ne s'applique plus"],a:0,e:"Le flux à travers une sphère de rayon $r$ se calcule pareil ; ce sont les bornes de $Q_{int}$ qui passent de $0\\to R$ à $0\\to r$."},
 {c:"Gauss",q:"Dans le calcul de $Q_{int}$ d'une sphère de rayon $R$ pour M à la distance $r$, la variable d'intégration doit être :",o:["$r'$, différente de $r$ et de $R$","$r$, comme la position de M","$R$, comme le rayon","peu importe"],a:0,e:"$R$ est le rayon de l'objet, $r$ la position de M. Réutiliser l'une des deux fait perdre des points."},

 // ---------- Potentiel ----------
 {c:"Potentiel",q:"La relation entre champ et potentiel :",o:["$\\vec E=-\\overrightarrow{\\mathrm{grad}}\\,V$","$\\vec E=\\overrightarrow{\\mathrm{grad}}\\,V$","$V=-\\overrightarrow{\\mathrm{grad}}\\,\\vec E$","$\\vec E=-\\dfrac{dV}{dt}$"],a:0,e:"Une des quatre relations du tableau laissé vide au contrôle."},
 {c:"Potentiel",q:"D'où vient le signe moins dans $\\vec E=-\\overrightarrow{\\mathrm{grad}}\\,V$ ?",o:["le gradient pointe vers les $V$ croissants, $\\vec E$ va vers les décroissants","d'une convention arbitraire","du signe de la charge","de l'orientation de $d\\vec S$"],a:0,e:"Les lignes de champ sont orientées dans le sens des potentiels décroissants."},
 {c:"Potentiel",q:"Énergie potentielle d'une charge $q$ placée en un point de potentiel $V$ :",o:["$E_p=qV$","$E_p=qV^2$","$E_p=V/q$","$E_p=-qV$"],a:0,e:"Deuxième relation du tableau. Avec $\\vec F=q\\vec E$ et $\\vec F=-\\overrightarrow{\\mathrm{grad}}\\,E_p$, les quatre sont cohérentes."},
 {c:"Potentiel",q:"La relation entre force et énergie potentielle :",o:["$\\vec F=-\\overrightarrow{\\mathrm{grad}}\\,E_p$","$\\vec F=\\overrightarrow{\\mathrm{grad}}\\,E_p$","$\\vec F=-q\\,\\overrightarrow{\\mathrm{grad}}\\,V^2$","$E_p=-\\overrightarrow{\\mathrm{grad}}\\,\\vec F$"],a:0,e:"Même structure que $\\vec E=-\\overrightarrow{\\mathrm{grad}}\\,V$, multipliée par $q$."},
 {c:"Potentiel",q:"Dans un champ uniforme colinéaire au déplacement :",o:["$\\Delta V=-Ed$","$\\Delta V=Ed^2$","$\\Delta V=-E/d$","$\\Delta V=0$"],a:0,e:"Ce n'est pas une formule de plus : c'est $\\Delta V=-\\int\\vec E\\cdot d\\vec l$ avec $E$ constant."},
 {c:"Potentiel",q:"La constante dans $V=K\\dfrac{q}{r}+\\text{cte}$ est prise nulle parce que :",o:["on choisit $V=0$ quand $r\\to\\infty$","$V$ doit être positif","la charge est ponctuelle","le champ est nul à l'infini"],a:0,e:"C'est le choix de référence. Du coup $E_p=0$ correspond aux charges infiniment éloignées."},
 {c:"Potentiel",q:"Énergie potentielle d'un ensemble de 3 charges :",o:["somme sur les 3 paires","somme des $q_iV_i$ pour chaque charge","$K\\dfrac{q_1q_2q_3}{r}$","$3K\\dfrac{q^2}{r}$"],a:0,e:"$E_p=\\sum_{i<j}K\\dfrac{q_iq_j}{r_{ij}}$. 3 charges $\\to$ 3 paires, 4 charges $\\to$ 6 paires."},
 {c:"Potentiel",q:"Une énergie potentielle négative pour un système de charges signifie :",o:["le système est lié : il faut fournir de l'énergie pour séparer","le système se sépare tout seul","il y a plus de charges négatives","le potentiel est négatif"],a:0,e:"$E_p=0$ correspond aux charges infiniment éloignées. Partir de $E_p<0$ et remonter à $0$ coûte de l'énergie."},
 {c:"Potentiel",q:"Les surfaces équipotentielles sont :",o:["perpendiculaires aux lignes de champ","parallèles aux lignes de champ","confondues avec les lignes de champ","toujours sphériques"],a:0,e:"Autour d'une charge ponctuelle ce sont des sphères ; dans un champ uniforme, des plans perpendiculaires à $\\vec E$."},
 {c:"Potentiel",q:"En sphérique, la composante selon $\\vec u_\\varphi$ du gradient porte le facteur :",o:["$\\dfrac{1}{r\\sin\\theta}$","$\\dfrac{1}{r}$","$r\\sin\\theta$","$1$"],a:0,e:"$\\overrightarrow{\\mathrm{grad}}f=\\dfrac{\\partial f}{\\partial r}\\vec u_r+\\dfrac1r\\dfrac{\\partial f}{\\partial\\theta}\\vec u_\\theta+\\dfrac{1}{r\\sin\\theta}\\dfrac{\\partial f}{\\partial\\varphi}\\vec u_\\varphi$."},
 {c:"Potentiel",q:"$V$ est une grandeur :",o:["scalaire : on somme directement, sans projeter","vectorielle : il faut projeter","toujours positive","orientée selon $\\vec u_r$"],a:0,e:"C'est ce qui rend le calcul du potentiel plus simple que celui du champ."},

 // ---------- Dipôle ----------
 {c:"Dipôle",q:"Un dipôle électrique, c'est :",o:["deux charges opposées de même module, séparées de $2a$","deux charges de même signe","une charge et un conducteur","une charge répartie en volume"],a:0,e:"$+q$ et $-q$, même module, signes opposés, distance $2a$."},
 {c:"Dipôle",q:"Le moment dipolaire $\\vec p$ est orienté :",o:["de la charge $-$ vers la charge $+$","de la charge $+$ vers la charge $-$","selon $\\vec E$","perpendiculairement à l'axe"],a:0,e:"$\\vec p=2aq\\,\\vec u_{N\\to P}=q\\,\\overrightarrow{NP}$. Sens inverse des lignes de champ entre les deux charges."},
 {c:"Dipôle",q:"La norme du moment dipolaire vaut :",o:["$p=2aq$","$p=aq$","$p=\\dfrac{q}{2a}$","$p=\\dfrac{2a}{q}$"],a:0,e:"Charge $\\times$ distance entre les deux charges. Unité : C·m, ou le debye."},
 {c:"Dipôle",q:"L'approximation dipolaire, c'est :",o:["$r\\gg 2a$","$r\\ll 2a$","$r=2a$","$a\\gg r$"],a:0,e:"On est loin devant la taille du dipôle. C'est elle qui autorise le développement limité de $1/PM$."},
 {c:"Dipôle",q:"Le potentiel créé par un dipôle décroît en :",o:["$1/r^2$","$1/r$","$1/r^3$","$1/r^4$"],a:0,e:"$V=K\\dfrac{\\vec p\\cdot\\vec r}{r^3}=K\\dfrac{p\\cos\\theta}{r^2}$. Plus vite que le $1/r$ d'une charge ponctuelle, parce que le dipôle est neutre."},
 {c:"Dipôle",q:"Le champ créé par un dipôle décroît en :",o:["$1/r^3$","$1/r^2$","$1/r$","$1/r^4$"],a:0,e:"$\\vec E=-\\overrightarrow{\\mathrm{grad}}\\,V$ : dériver un $1/r^2$ donne un $1/r^3$. $E_r=\\dfrac{2Kp\\cos\\theta}{r^3}$ et $E_\\theta=\\dfrac{Kp\\sin\\theta}{r^3}$."},
 {c:"Dipôle",q:"Un dipôle dans un champ extérieur uniforme subit :",o:["une résultante nulle mais un couple","une résultante non nulle","ni force ni couple","une force selon $\\vec p$"],a:0,e:"Les deux forces $\\pm q\\vec E$ sont opposées : pas de translation, mais un couple qui fait tourner le dipôle."},
 {c:"Dipôle",q:"Le moment des forces sur un dipôle vaut :",o:["$\\vec{\\mathcal M}=\\vec p\\wedge\\vec E$","$\\vec{\\mathcal M}=\\vec p\\cdot\\vec E$","$\\vec{\\mathcal M}=-\\vec p\\cdot\\vec E$","$\\vec{\\mathcal M}=q\\vec E$"],a:0,e:"Produit vectoriel : nul quand $\\vec p$ et $\\vec E$ sont colinéaires, c'est-à-dire à l'équilibre."},
 {c:"Dipôle",q:"L'énergie potentielle d'un dipôle dans un champ extérieur :",o:["$E_p=-\\vec p\\cdot\\vec E$","$E_p=\\vec p\\cdot\\vec E$","$E_p=\\vec p\\wedge\\vec E$","$E_p=qV^2$"],a:0,e:"Produit scalaire, avec un signe moins. Ne pas confondre avec le moment, qui est un produit vectoriel."},
 {c:"Dipôle",q:"L'équilibre est <b>stable</b> quand :",o:["$\\vec p$ et $\\vec E$ sont de même sens, $E_p=-pE$","$\\vec p$ et $\\vec E$ sont opposés, $E_p=+pE$","$\\vec p$ est perpendiculaire à $\\vec E$","$E_p$ est maximale"],a:0,e:"À l'équilibre stable l'énergie potentielle est minimale. $\\theta=0$ donne $\\cos\\theta=1$ et $E_p=-pE$."},
 {c:"Dipôle",q:"La molécule d'eau possède un moment dipolaire de :",o:["$1{,}85$ D","$1{,}85$ C·m","$0$, elle est neutre","$9\\times10^9$ D"],a:0,e:"Neutre ne veut pas dire non polaire : le barycentre des charges $+$ ne coïncide pas avec celui du $-$."},
 {c:"Dipôle",q:"Autour d'un ion en solution, les molécules d'eau s'orientent : on parle de",o:["couche d'hydratation, ou solvatation","polarisation spontanée","effet de pointe","cage de Faraday"],a:0,e:"Chaque molécule d'eau est un dipôle qui s'aligne sur le champ créé par l'ion."},

 // ---------- Conducteurs ----------
 {c:"Conducteurs",q:"Un conducteur est à l'équilibre électrostatique lorsque :",o:["il n'y a plus de mouvement de charges dans le conducteur","il est neutre","il est isolé","le champ extérieur est nul"],a:0,e:"C'est la définition à donner telle quelle. Tout le reste en découle."},
 {c:"Conducteurs",q:"Dans un conducteur à l'équilibre, le champ à l'intérieur :",o:["est nul","vaut $\\sigma/\\varepsilon_0$","vaut $\\dfrac{Q}{4\\pi\\varepsilon_0r^2}$","est perpendiculaire à la surface"],a:0,e:"Sinon les charges libres se mettraient en mouvement et l'équilibre serait rompu."},
 {c:"Conducteurs",q:"La charge d'un conducteur isolé chargé se répartit :",o:["à sa surface","uniformément dans son volume","en son centre","sur ses arêtes seulement"],a:0,e:"Conséquence directe de $\\vec E=\\vec 0$ à l'intérieur, par le théorème de Gauss."},
 {c:"Conducteurs",q:"Juste à l'extérieur d'un conducteur chargé, le champ :",o:["est perpendiculaire à la surface et vaut $\\dfrac{\\sigma}{\\varepsilon_0}$","est tangent et vaut $\\dfrac{\\sigma}{\\varepsilon_0}$","vaut $\\dfrac{\\sigma}{2\\varepsilon_0}$","est nul"],a:0,e:"$\\sigma/2\\varepsilon_0$, c'est le plan infini seul, pas le conducteur. Ne pas confondre."},
 {c:"Conducteurs",q:"Sur un conducteur de forme irrégulière, $\\sigma$ est maximale :",o:["là où le rayon de courbure est le plus petit","là où le rayon de courbure est le plus grand","sur les parties planes","partout identique"],a:0,e:"C'est le pouvoir des pointes : les charges s'accumulent sur les zones pointues."},
 {c:"Conducteurs",q:"Dans une cavité vide à l'intérieur d'un conducteur, le champ :",o:["est nul : c'est la cage de Faraday","vaut $\\sigma/\\varepsilon_0$","vaut $\\dfrac{Q}{4\\pi\\varepsilon_0r^2}$","dépend du champ extérieur"],a:0,e:"C'est ce qui protège l'intérieur d'une voiture ou d'un avion frappé par la foudre."},
 {c:"Conducteurs",q:"La surface d'un conducteur chargé à l'équilibre est :",o:["une surface équipotentielle","une ligne de champ","à potentiel nul","à potentiel variable selon la courbure"],a:0,e:"Et $V$ est constant en tout point à l'intérieur, égal à sa valeur en surface."},
 {c:"Conducteurs",q:"Deux conducteurs reliés par un fil conducteur sont :",o:["au même potentiel","à la même charge","au même champ de surface","à la même densité $\\sigma$"],a:0,e:"C'est la clé de l'exercice des deux sphères : traduire « reliés par un fil » en $V_1=V_2$."},
 {c:"Conducteurs",q:"Deux sphères de rayons $R_1$ et $R_2$ reliées par un fil. Le rapport des champs de surface :",o:["$\\dfrac{E_1}{E_2}=\\dfrac{R_2}{R_1}$","$\\dfrac{E_1}{E_2}=\\dfrac{R_1}{R_2}$","$\\dfrac{E_1}{E_2}=\\left(\\dfrac{R_2}{R_1}\\right)^2$","$\\dfrac{E_1}{E_2}=1$"],a:0,e:"$V_1=V_2$ donne $\\dfrac{Q_1}{Q_2}=\\dfrac{R_1}{R_2}$, puis $E=\\dfrac{KQ}{R^2}$ donne $\\dfrac{E_1}{E_2}=\\dfrac{R_2}{R_1}$ : le champ est plus fort sur la petite sphère."},
 {c:"Conducteurs",q:"Quand le rayon d'une sphère diminue, sa charge diminue aussi. Pourtant $\\sigma$ augmente, parce que :",o:["la surface diminue en $R^2$, plus vite que $Q$ qui diminue en $R$","la charge augmente en réalité","$\\sigma$ ne dépend pas de la surface","le potentiel augmente"],a:0,e:"$\\sigma=\\dfrac{Q}{4\\pi R^2}$ : le dénominateur chute plus vite que le numérateur. C'est le mécanisme de l'effet de pointe."},
 {c:"Conducteurs",q:"Coquille conductrice autour d'une charge intérieure $+Q$. Pour trouver la charge de sa surface interne :",o:["Gauss dans l'épaisseur du conducteur, où $\\vec E=\\vec 0$","la conservation de la charge seulement","c'est moitié-moitié","la loi de Coulomb"],a:0,e:"$\\vec E=\\vec 0$ dans le conducteur donne $Q_{int}=0$ pour une surface de Gauss prise dans l'épaisseur, donc $Q_{\\text{surf int}}=-Q$."},
 {c:"Conducteurs",q:"Pour une coquille portant $-2Q$ autour d'une sphère isolante $+Q$, la répartition « moitié-moitié » est :",o:["fausse : c'est la charge intérieure qui impose la répartition","toujours vraie","vraie si la coquille est fine","vraie si les rayons sont proches"],a:0,e:"Ici on trouve $-Q$ sur la surface interne et $-Q$ sur l'externe. Refaire le calcul à chaque fois."},
 {c:"Conducteurs",q:"Une sphère <b>isolante</b> chargée en volume :",o:["ne suit pas les propriétés des conducteurs : le champ n'est pas nul dedans","a un champ nul à l'intérieur","porte toute sa charge en surface","est une équipotentielle"],a:0,e:"Le mot « isolante » change tout. À l'intérieur, $E=\\dfrac{\\rho r}{3\\varepsilon_0}$, calculé par Gauss."},

 // ---------- Condensateurs ----------
 {c:"Condensateurs",q:"La définition générale de la capacité :",o:["$C=\\dfrac{Q}{\\Delta V}$","$C=\\dfrac{\\Delta V}{Q}$","$C=Q\\,\\Delta V$","$C=\\dfrac{\\varepsilon_0 S}{d}$"],a:0,e:"Valable pour tout condensateur. $\\varepsilon_0S/d$, lui, n'est vrai que pour le condensateur plan."},
 {c:"Condensateurs",q:"L'unité de capacité est :",o:["le farad (F)","le volt","le coulomb","le henry"],a:0,e:"Ordres de grandeur : du $\\mu$F $(10^{-6})$ au pF $(10^{-12})$. En TP, plutôt le nF $(10^{-9})$."},
 {c:"Condensateurs",q:"Capacité d'un condensateur plan :",o:["$C=\\dfrac{\\varepsilon_0 S}{d}$","$C=\\dfrac{\\varepsilon_0 d}{S}$","$C=\\dfrac{S}{\\varepsilon_0 d}$","$C=\\varepsilon_0 S d$"],a:0,e:"Plus les armatures sont grandes et proches, plus la capacité est forte."},
 {c:"Condensateurs",q:"Le champ entre les armatures d'un condensateur plan :",o:["$E=\\dfrac{\\sigma}{\\varepsilon_0}=\\dfrac{Q}{\\varepsilon_0 S}$","$E=\\dfrac{\\sigma}{2\\varepsilon_0}$","$E=\\dfrac{Q}{4\\pi\\varepsilon_0 d^2}$","$E=0$"],a:0,e:"Un plan seul donne $\\sigma/2\\varepsilon_0$ ; deux plans opposés, par superposition, donnent le double entre eux."},
 {c:"Condensateurs",q:"Deux condensateurs en <b>parallèle</b> :",o:["$C_{eq}=C_1+C_2$","$\\dfrac{1}{C_{eq}}=\\dfrac{1}{C_1}+\\dfrac{1}{C_2}$","$C_{eq}=C_1C_2$","$C_{eq}=C_1-C_2$"],a:0,e:"C'est l'inverse des résistances : les capacités s'ajoutent en parallèle."},
 {c:"Condensateurs",q:"Deux condensateurs en <b>série</b> :",o:["$\\dfrac{1}{C_{eq}}=\\dfrac{1}{C_1}+\\dfrac{1}{C_2}$","$C_{eq}=C_1+C_2$","$C_{eq}=C_1C_2$","$C_{eq}=2C_1$"],a:0,e:"Toujours l'inverse des résistances."},
 {c:"Condensateurs",q:"L'énergie emmagasinée dans un condensateur chargé :",o:["$W=\\dfrac{Q^2}{2C}=\\tfrac12 Q\\Delta V=\\tfrac12 C\\Delta V^2$","$W=Q\\Delta V$","$W=C\\Delta V$","$W=\\dfrac{Q}{2C}$"],a:0,e:"Les trois écritures sont équivalentes via $C=Q/\\Delta V$."},
 {c:"Condensateurs",q:"Un diélectrique, c'est :",o:["un isolant qui se polarise sous l'action d'un champ","un bon conducteur","un semi-conducteur","le vide entre les armatures"],a:0,e:"Verre, caoutchouc… Sous l'action de $\\vec E$, des charges induites apparaissent sur ses faces."},
 {c:"Condensateurs",q:"À charge $Q$ constante, on insère un diélectrique de constante $\\varepsilon$. Alors :",o:["$\\Delta V$ diminue, $C$ augmente, $E$ diminue","$\\Delta V$ augmente, $C$ diminue","tout reste identique","$Q$ diminue"],a:0,e:"$\\Delta V=\\dfrac{\\Delta V_0}{\\varepsilon}$, $C=\\varepsilon C_0$, $E=\\dfrac{E_0}{\\varepsilon}$. Retenir : $Q$ constante, les trois autres bougent."},
 {c:"Condensateurs",q:"La constante diélectrique $\\varepsilon$ est :",o:["sans dimension et supérieure à 1","en farads","inférieure à 1","égale à $\\varepsilon_0$"],a:0,e:"C'est un facteur multiplicatif. Ne pas la confondre avec $\\varepsilon_0$, qui a une unité."},
 {c:"Condensateurs",q:"Pourquoi le champ diminue-t-il dans le diélectrique ?",o:["les charges induites créent un champ opposé à $\\vec E_0$","le diélectrique absorbe les charges","la charge des armatures diminue","la distance augmente"],a:0,e:"Superposition : $E=E_0-E_{ind}$. Les charges induites sont $-q$ côté armature $+$, et $+q$ côté armature $-$."},
 {c:"Condensateurs",q:"Deux plans infinis parallèles de charges opposées : à l'extérieur, le champ vaut",o:["$0$","$\\dfrac{\\sigma}{\\varepsilon_0}$","$\\dfrac{\\sigma}{2\\varepsilon_0}$","$\\dfrac{2\\sigma}{\\varepsilon_0}$"],a:0,e:"Les deux contributions sont opposées à l'extérieur et s'annulent ; entre les plans elles s'ajoutent et donnent $\\sigma/\\varepsilon_0$."},
 {c:"Condensateurs",q:"Quelles formules sont <b>générales</b>, valables pour tout condensateur ?",o:["$C=\\dfrac{Q}{\\Delta V}$ et les associations série/parallèle","$C=\\dfrac{\\varepsilon_0S}{d}$","$W=\\tfrac12\\varepsilon_0SdE^2$","$E=\\dfrac{\\sigma}{\\varepsilon_0}$ entre armatures"],a:0,e:"Les trois autres sont spécifiques au condensateur plan. La prof insiste sur cette distinction."},
 {c:"Condensateurs",q:"La méthode imposée pour la capacité d'un condensateur cylindrique ou sphérique :",o:["$\\vec E$ par Gauss, puis $V$ par le gradient, puis $C=Q/\\Delta V$","$C=\\varepsilon_0S/d$ directement","mesurer en TP","Coulomb puis intégrale"],a:0,e:"Dans cet ordre, avec dessin, symétries et invariances rédigés. C'est ce que demande le TD du chapitre 6."}
];

const CHAPS = ["Tout","1-2","Gauss","Potentiel","Dipôle","Conducteurs","Condensateurs","Erreurs"];
let filter = "Tout", queue = [], current = null, answered = false;
let good = 0, total = 0, streak = 0, best = 0;
const stats = new Map();

const $ = id => document.getElementById(id);
$("count").textContent = BANK.length;

function typeset(){
  if(window.MathJax && MathJax.typesetPromise){
    MathJax.typesetPromise([$("question"), $("opts"), $("exp")]).catch(()=>{});
  }
}

CHAPS.forEach(c=>{
  const b = document.createElement("button");
  b.className = "chip" + (c === "Erreurs" ? " err" : "");
  b.textContent = c === "Tout" ? "Tout le cours" : c === "Erreurs" ? "Mes erreurs" : "Ch. " + c;
  b.dataset.chap = c;
  b.setAttribute("aria-pressed", String(c === filter));
  b.onclick = () => {
    if(c === "Erreurs" && !wrongOnes().length) return;
    filter = c;
    [...$("chips").children].forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    queue = []; nextQ();
  };
  $("chips").appendChild(b);
});

function wrongOnes(){ return BANK.filter(q => stats.get(q) && stats.get(q).last === false); }
function pool(){
  if(filter === "Erreurs"){ const w = wrongOnes(); return w.length ? w : BANK.slice(); }
  return filter === "Tout" ? BANK.slice() : BANK.filter(q => q.c === filter);
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function nextQ(){
  if(!queue.length) queue = shuffle(pool());
  current = queue.shift();
  answered = false;
  $("tag").textContent = current.c === "1-2" ? "Chapitres 1 et 2" : "Chapitre — " + current.c;
  $("question").innerHTML = current.q;
  $("exp").hidden = true;
  $("next").hidden = true;
  const box = $("opts"); box.innerHTML = "";
  const order = shuffle(current.o.map((t,i)=>({t, ok: i === current.a})));
  order.forEach((o,i)=>{
    const b = document.createElement("button");
    b.className = "opt"; b.type = "button";
    b.dataset.ok = o.ok ? "1" : "0";
    b.innerHTML = '<span class="key">'+(i+1)+'</span><span class="txt">'+o.t+'</span>';
    b.onclick = () => answer(b, o.ok, box);
    box.appendChild(b);
  });
  drawScore();
  typeset();
}

function answer(btn, ok, box){
  if(answered) return;
  answered = true; total++;
  stats.set(current, {last: ok});
  [...box.children].forEach(c => c.disabled = true);
  if(ok){ good++; streak++; best = Math.max(best, streak); btn.classList.add("good"); }
  else {
    streak = 0; btn.classList.add("bad");
    [...box.children].forEach((c,i) => { if(order_ok(c)) c.classList.add("good"); });
    queue.splice(Math.min(3, queue.length), 0, current);
  }
  $("exp").innerHTML = '<span class="verdict '+(ok?"ok":"no")+'">'+(ok?"Juste.":"Raté.")+'</span> '+current.e;
  $("exp").hidden = false;
  $("next").hidden = false;
  $("next").focus();
  drawScore();
  typeset();
}

function order_ok(el){
  return el.dataset.ok === "1";
}

function drawScore(){
  const pct = total ? Math.round(100*good/total) : 0;
  $("score").innerHTML = "<b>"+good+"</b> / "+total+(total?" &middot; "+pct+"%":"")+
    " &middot; série <b>"+streak+"</b>"+(best>2?" (record "+best+")":"");

  const set = filter === "Erreurs" ? BANK : pool();
  const done = set.filter(q => stats.get(q) && stats.get(q).last === true).length;
  $("barfill").style.width = (set.length ? Math.round(100*done/set.length) : 0) + "%";
  $("mastered").innerHTML = "<b>"+done+"</b> / "+set.length+" maîtrisées"+
    (filter === "Tout" || filter === "Erreurs" ? "" : " dans ce chapitre");

  const w = wrongOnes().length;
  $("errcount").textContent = w ? w + " à revoir" : "aucune erreur en attente";
  const chip = [...$("chips").children].find(c => c.dataset.chap === "Erreurs");
  if(chip) chip.disabled = !w;
}

$("next").onclick = nextQ;
document.addEventListener("keydown", e => {
  if(e.key === "Enter" && answered){ e.preventDefault(); nextQ(); return; }
  if(!answered && ["1","2","3","4"].includes(e.key)){
    const b = $("opts").children[+e.key - 1]; if(b) b.click();
  }
});
nextQ();
</script>

</body></html>
